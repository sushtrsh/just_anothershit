name: Build and Release Kernel Manager Module

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract module info
        id: mod_info
        run: |
          PROP_FILE="modules/module.prop"
          if [ ! -f "$PROP_FILE" ]; then
            echo "Error: $PROP_FILE not found!"
            exit 1
          fi

          MOD_ID=$(grep -E '^id=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
          MOD_VER=$(grep -E '^version=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
          MOD_NAME=$(grep -E '^name=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')

          MOD_ID=${MOD_ID:-kernel-manager}
          MOD_VER=${MOD_VER:-v1.0}
          MOD_NAME=${MOD_NAME:-Kernel Manager}

          SAFE_VER=$(echo "$MOD_VER" | tr ' ' '_')

          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "mod_ver=$MOD_VER" >> "$GITHUB_OUTPUT"
          echo "mod_name=$MOD_NAME" >> "$GITHUB_OUTPUT"
          echo "safe_ver=$SAFE_VER" >> "$GITHUB_OUTPUT"

      - name: Prepare module packaging
        run: |
          mkdir -p build_tmp
          cp -r modules/* build_tmp/

          cd build_tmp

          # Clean unwanted runtime logs, backups and temporary files
          find . -type f \( -name "*.bak" -o -name "*.log" -o -name "*.pid" -o -name "current_pkg" -o -name "current_profile" \) -delete

          # Convert CRLF to Unix LF for shell scripts and config files
          find . -type f \( -name "*.sh" -o -name "tkm" -o -name "*.prop" -o -name "*.conf" -o -name "*.html" \) -exec sed -i 's/\r$//' {} +

          # Ensure META-INF flashable binary exists for Magisk / KernelSU / APatch
          if [ ! -f "META-INF/com/google/android/update-binary" ]; then
            mkdir -p META-INF/com/google/android
            echo -e "#!/sbin/sh\n#MAGISK" > META-INF/com/google/android/update-binary
            echo "#MAGISK" > META-INF/com/google/android/updater-script
          fi

          # Ensure executable permissions
          find . -type f -name "*.sh" -exec chmod 755 {} +
          [ -f "customize.sh" ] && chmod 755 customize.sh
          [ -f "tkm" ] && chmod 755 tkm
          [ -f "system/bin/tkm" ] && chmod 755 system/bin/tkm
          chmod 755 META-INF/com/google/android/update-binary 2>/dev/null || true

      - name: Create ZIP package
        id: package
        run: |
          MOD_ID="${{ steps.mod_info.outputs.mod_id }}"
          SAFE_VER="${{ steps.mod_info.outputs.safe_ver }}"
          ZIP_NAME="${MOD_ID}-${SAFE_VER}.zip"

          cd build_tmp
          zip -r9 "../${ZIP_NAME}" ./*

          cd ..
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256_path=${GITHUB_WORKSPACE}/${ZIP_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sha256_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}-build{1}', steps.mod_info.outputs.safe_ver, github.run_number) }}
          name: "${{ steps.mod_info.outputs.mod_name }} ${{ steps.mod_info.outputs.mod_ver }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sha256_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
